<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dunkles Studio mit Lichtreflexion auf lackierter Fläche">
  <!--
    KlaroClean Hero-Artwork (Fallback, solange kein Foto im Theme-Editor gewählt ist).
    Dunkles Studio mit einer starken Lichtquelle und Lack-Reflexion — als Vektor
    gebaut, weil der Stock-Foto-Download (Unsplash) aus der Build-Umgebung durch
    die Netzwerk-Allowlist blockiert war. Austausch: siehe sections/hero.liquid.
  -->
  <defs>
    <radialGradient id="glow" cx="72%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#1E90FF" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#16345C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0C10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navy" cx="12%" cy="92%" r="70%">
      <stop offset="0%" stop-color="#0F1B2E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A0C10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05060A" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9FCBFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#CFE6FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9FCBFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E90FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1E90FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E90FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10141B"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>
    <filter id="blurXL" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blurS" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="2400" height="1600" fill="#0A0C10"/>
  <rect width="2400" height="1600" fill="url(#glow)"/>
  <rect width="2400" height="1600" fill="url(#navy)"/>

  <!-- Lack-/Bodenfläche -->
  <rect y="1080" width="2400" height="520" fill="url(#floor)"/>

  <!-- Studio-Lichtbalken -->
  <g transform="rotate(-8 1500 600)">
    <rect x="420" y="520" width="1700" height="120" fill="url(#beamSoft)" filter="url(#blurXL)"/>
    <rect x="520" y="560" width="1500" height="14" rx="7" fill="url(#beam)" filter="url(#blurS)"/>
  </g>

  <!-- Reflexion des Lichtbalkens auf dem Lack -->
  <g transform="rotate(8 1500 1180)" opacity="0.35">
    <rect x="560" y="1165" width="1400" height="60" fill="url(#beamSoft)" filter="url(#blurXL)"/>
    <rect x="640" y="1186" width="1240" height="8" rx="4" fill="url(#beam)" filter="url(#blurS)"/>
  </g>

  <rect width="2400" height="1600" fill="url(#vig)"/>
</svg>
