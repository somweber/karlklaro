<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dunkles Studio mit Lichtreflexion auf lackierter Fläche">
  <!-- Mobile-Variante des KlaroClean Hero-Artworks: Glow zentrierter,
       Lichtbalken steiler — komponiert für Hochkant-Beschnitt. -->
  <defs>
    <radialGradient id="glow" cx="60%" cy="14%" r="80%">
      <stop offset="0%" stop-color="#1E90FF" stop-opacity="0.36"/>
      <stop offset="45%" stop-color="#16345C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0C10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="44%" r="80%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05060A" stop-opacity="0.82"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9FCBFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#CFE6FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9FCBFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E90FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1E90FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#1E90FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10141B"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>
    <filter id="blurXL" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blurS" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1200" height="800" fill="#0A0C10"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <rect y="560" width="1200" height="240" fill="url(#floor)"/>

  <g transform="rotate(-12 600 320)">
    <rect x="120" y="290" width="960" height="70" fill="url(#beamSoft)" filter="url(#blurXL)"/>
    <rect x="180" y="312" width="840" height="10" rx="5" fill="url(#beam)" filter="url(#blurS)"/>
  </g>

  <g transform="rotate(12 600 620)" opacity="0.35">
    <rect x="200" y="612" width="800" height="36" fill="url(#beamSoft)" filter="url(#blurXL)"/>
    <rect x="260" y="624" width="680" height="6" rx="3" fill="url(#beam)" filter="url(#blurS)"/>
  </g>

  <rect width="1200" height="800" fill="url(#vig)"/>
</svg>
